# LENSIQ CI — lint + typecheck + unit (Node), server tests (Python), end-to-end (headless Chrome, no WebGL),
# privacy (no third-party requests), i18n coverage, Git LFS readiness.
# The site itself is static (GitHub Pages); this workflow only tests it. pages-lfs.yml deploys ONLY after this workflow
# succeeds for a push to main (workflow_run gate). Actions are pinned to commit SHAs (Dependabot: .github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint + unit (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Git LFS (docs/LFS-MIGRATION.md): cached by object list; no-ops while vendor/ is still plain git
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - name: no LFS pointer files in the working tree
        run: node tools/check-lfs.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Format check on ADDED lines only (tools/format-check.mjs, rules in .editorconfig: LF, no tabs, no trailing
      # whitespace, code lines <= 200 characters). Fails a pull request; on a push to main it is reported as a warning
      # (round 12 introduced it — the round's own direct pushes are not blocked). Needs the parent commit: fetch-depth 2.
      - name: format check (added lines; fails on pull requests)
        run: |
          node tools/format-check.mjs --selftest
          if [ "${{ github.event_name }}" = "pull_request" ]; then node tools/format-check.mjs --base HEAD~1
          else node tools/format-check.mjs --base HEAD~1 --warn-only; fi
      - name: type-check shared modules (tsc --checkJs, tsconfig.typecheck.json)
        run: npm run typecheck
      - name: unit tests (includes backend/ Worker — auth, analytics validation, retention, entitlements, Opn webhook, AI proxy — on an in-memory D1 shim)
        run: npm run test:unit
      # Ratchet: type errors across ALL root *.js (npm run typecheck:report) may only go down. When you fix files, lower
      # TYPECHECK_MAX to the new total in the same commit; never raise it. Lower it at the end of EVERY round:
      #   round 10: 800 (measured 790)   round 11: 714 (palm.js 46 -> 0 and gated; pricing/account/report/legal/leads gated)
      #   round 12: 632 (measured 624: photobooth.js 93 -> 0 and gated as its own program — page scripts are now counted
      #             in their own program, as the gate checks them; +8 for the round's parallel work in flight — lower it
      #             to the measured total at the start of round 13). 136 of the 624 are vendor/mediapipe/vision_bundle.mjs,
      #             pulled in by signage.js's literal import() (photobooth.js imports it through a variable path).
      #   round 17: 627 (measured 627; lensiq-pc.js / -run.js / -ui.js now gated in tsconfig.typecheck.json)
      - name: typecheck ratchet — total errors in the full report must not rise
        env:
          TYPECHECK_MAX: "627"
        run: |
          npm run --silent typecheck:report | tee typecheck-report.txt
          total=$(sed -nE 's/^([0-9]+) error\(s\) in .*/\1/p' typecheck-report.txt | tail -1)
          test -n "$total" || { echo "could not read the error total"; exit 1; }
          echo "typecheck report: $total error(s), ratchet max $TYPECHECK_MAX"
          if [ "$total" -gt "$TYPECHECK_MAX" ]; then echo "::error::type errors rose to $total (max $TYPECHECK_MAX)"; exit 1; fi
      # The API Worker really bundles (wrangler's esbuild, pinned by backend/package-lock.json). --dry-run needs no
      # Cloudflare account or secrets and deploys nothing. Runs after typecheck: backend/node_modules would otherwise
      # replace the minimal ambient SDK types of backend/types/worker.d.ts.
      - name: API Worker bundles (wrangler deploy --dry-run)
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-admin.mjs
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
          test -s "$RUNNER_TEMP/worker-dist/worker.js"
      # Round 11: the Worker in the REAL runtime (workerd via Miniflare from backend/node_modules) with a real local D1,
      # the real migrations and a faked Opn / Google / Turnstile — checkout -> webhook -> receipt -> refund -> credit note.
      - name: API Worker integration (workerd + local D1)
        run: npm run test:integration
      - name: CSP <meta> present and current on every page
        run: node tools/csp-meta.mjs --check
      - name: no Google Fonts / third-party font references (fonts are self-hosted)
        run: node tools/self-host-fonts.mjs --check
      - name: published site contains no server code / tests / tools / docs / package.json / *.py (allowlist build)
        run: node tools/build-site.mjs && node tools/check-site.mjs --static
      - name: legal pages have no raw [placeholders]; seller details complete whenever billing is on
        run: node tools/check-legal.mjs

  python:
    name: Server tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/python -v

  # Round 16: the browser checks run as two parallel jobs (same checks, same flags) because one job passed 75 minutes
  # once the 7 category pages were added. Neither job skips or loosens anything.
  e2e:
    name: End-to-end (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Git LFS (docs/LFS-MIGRATION.md): cached by object list; no-ops while vendor/ is still plain git
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python venv for server.py (agg / csp e2e start the real server)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - run: npm ci
      - name: Thai + CJK fonts (line-breaking checks need real glyphs)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-thai-tlwg fonts-noto-cjk
      - name: e2e (one retry per failing file)
        run: npm run test:e2e:ci
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: pages under the GitHub Pages <meta> CSP
        run: node tools/check-csp.mjs
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: built _site — every page loads under /lensiq/ in TH + 中文 with no 404 (same as the Pages deploy)
        run: node tools/build-site.mjs && node tools/check-site.mjs
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: no page requests a third-party origin (th + zh)
        run: node tools/check-external.mjs --as-is
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}

  browser-audits:
    name: Phone and language gates (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Git LFS (docs/LFS-MIGRATION.md): cached by object list; no-ops while vendor/ is still plain git
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python venv for server.py (agg / csp e2e start the real server)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - run: npm ci
      - name: Thai + CJK fonts (line-breaking checks need real glyphs)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-thai-tlwg fonts-noto-cjk
      - name: mobile-audit detector self-test
        run: node tools/mobile-audit.mjs --selftest
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: phone gate — no horizontal overflow, text contrast >= 4.5:1, every form control labelled (320 / 360 / 390 px)
        run: |
          for w in 320 360 390; do
            node tools/mobile-audit.mjs --width $w --strict --checks overflow,contrast,unlabeled,errors --details || exit 1
          done
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # English and Chinese strings are longer / wider than Thai: the same page can overflow at 360 px only in EN
      # (driver.html, round 10). Touch targets (>= 44 x 44 CSS px, WCAG 2.5.5) are gated here too.
      - name: phone gate — 360 px in TH / EN / 中文 and 390 px TH (overflow, touch targets >= 44 px, contrast)
        run: |
          for lang in th en zh; do
            node tools/mobile-audit.mjs --width 360 --lang $lang --strict --checks overflow,targets,contrast,hiddenShown,crumbs,thaiTracking --details || exit 1
          done
          node tools/mobile-audit.mjs --width 390 --lang th --strict --checks overflow,targets,contrast --details
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # Round 12: the same checks AFTER interaction — open drawer, compact language menu (320 px), sign-in dialog, guest
      # (light) and full readings, the signed-in account page and its error state (mocked API Worker from
      # tests/e2e/member.e2e.mjs; nothing leaves the runner). Also: no element with [hidden] may render, the breadcrumb
      # stays on one line, Thai is never letter-spaced, and each state's own expectations (no "retry" when nothing failed).
      - name: phone gate — post-interaction states at 360 px in TH / EN / 中文
        run: |
          for lang in th en zh; do
            node tools/mobile-audit.mjs --states --width 360 --lang $lang --strict --checks overflow,targets,contrast,hiddenShown,crumbs,thaiTracking,state,errors --details || exit 1
          done
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: shared components 100 % Chinese in 中文 mode
        run: node tools/zh-coverage.mjs --shared --no-interact --max 0
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: shared components 100 % English in English mode
        run: node tools/zh-coverage.mjs --lang en --shared --no-interact --max 0
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: zh coverage report per page (after typical interactions)
        if: always()
        run: node tools/zh-coverage.mjs --top 10 --json zh-coverage.json
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Latin-only leftovers on Thai and 中文 pages (report only — untranslated English / technical wording)
        if: always()
        run: |
          node tools/zh-coverage.mjs --latin --lang th --no-interact --json latin-th.json
          node tools/zh-coverage.mjs --latin --lang zh --no-interact --json latin-zh.json
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: phone layout report (390 px)
        if: always()
        run: node tools/mobile-audit.mjs --json mobile-audit.json
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-audit
          path: mobile-audit.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zh-coverage
          path: |
            zh-coverage.json
            latin-th.json
            latin-zh.json
          if-no-files-found: ignore
