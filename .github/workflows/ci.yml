# LENSIQ CI — lint + typecheck + unit (Node), server tests (Python), end-to-end (headless Chrome, no WebGL),
# privacy (no third-party requests), i18n coverage, Git LFS readiness.
# The site itself is static (GitHub Pages); this workflow only tests it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint + unit (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Git LFS (docs/LFS-MIGRATION.md): cached by object list; no-ops while vendor/ is still plain git
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - name: no LFS pointer files in the working tree
        run: node tools/check-lfs.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: type-check shared modules (tsc --checkJs, tsconfig.typecheck.json)
        run: npm run typecheck
      - name: unit tests (includes backend/ Worker — auth, analytics validation, retention, entitlements, Opn webhook, AI proxy — on an in-memory D1 shim)
        run: npm run test:unit
      # Ratchet: type errors across ALL root *.js (npm run typecheck:report) may only go down. When you fix files, lower
      # TYPECHECK_MAX to the new total in the same commit; never raise it.
      - name: typecheck ratchet — total errors in the full report must not rise
        env:
          TYPECHECK_MAX: "800"
        run: |
          npm run --silent typecheck:report | tee typecheck-report.txt
          total=$(sed -nE 's/^([0-9]+) error\(s\) in .*/\1/p' typecheck-report.txt | tail -1)
          test -n "$total" || { echo "could not read the error total"; exit 1; }
          echo "typecheck report: $total error(s), ratchet max $TYPECHECK_MAX"
          if [ "$total" -gt "$TYPECHECK_MAX" ]; then echo "::error::type errors rose to $total (max $TYPECHECK_MAX)"; exit 1; fi
      # The API Worker really bundles (wrangler's esbuild, pinned by backend/package-lock.json). --dry-run needs no
      # Cloudflare account or secrets and deploys nothing. Runs after typecheck: backend/node_modules would otherwise
      # replace the minimal ambient SDK types of backend/types/worker.d.ts.
      - name: API Worker bundles (wrangler deploy --dry-run)
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-admin.mjs
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
          test -s "$RUNNER_TEMP/worker-dist/index.js"
      - name: CSP <meta> present and current on every page
        run: node tools/csp-meta.mjs --check
      - name: no Google Fonts / third-party font references (fonts are self-hosted)
        run: node tools/self-host-fonts.mjs --check
      - name: published site contains no server code / tests / tools / docs / package.json / *.py (allowlist build)
        run: node tools/build-site.mjs && node tools/check-site.mjs --static

  python:
    name: Server tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/python -v

  e2e:
    name: End-to-end (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      # Git LFS (docs/LFS-MIGRATION.md): cached by object list; no-ops while vendor/ is still plain git
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python venv for server.py (agg / csp e2e start the real server)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: npm ci
      - name: Thai + CJK fonts (line-breaking checks need real glyphs)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-thai-tlwg fonts-noto-cjk
      - name: mobile-audit detector self-test
        run: node tools/mobile-audit.mjs --selftest
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: phone gate — no horizontal overflow, text contrast >= 4.5:1, every form control labelled (320 / 360 / 390 px)
        run: |
          for w in 320 360 390; do
            node tools/mobile-audit.mjs --width $w --strict --checks overflow,contrast,unlabeled,errors --details || exit 1
          done
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: e2e (one retry per failing file)
        run: npm run test:e2e:ci
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: pages under the GitHub Pages <meta> CSP
        run: node tools/check-csp.mjs
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: built _site — every page loads under /lensiq/ in TH + 中文 with no 404 (same as the Pages deploy)
        run: node tools/build-site.mjs && node tools/check-site.mjs
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: no page requests a third-party origin (th + zh)
        run: node tools/check-external.mjs --as-is
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: shared components 100 % Chinese in 中文 mode
        run: node tools/zh-coverage.mjs --shared --no-interact --max 0
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: shared components 100 % English in English mode
        run: node tools/zh-coverage.mjs --lang en --shared --no-interact --max 0
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: zh coverage report per page (after typical interactions)
        if: always()
        run: node tools/zh-coverage.mjs --top 10 --json zh-coverage.json
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: phone layout report (390 px)
        if: always()
        run: node tools/mobile-audit.mjs --json mobile-audit.json
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-audit
          path: mobile-audit.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zh-coverage
          path: zh-coverage.json
          if-no-files-found: ignore
