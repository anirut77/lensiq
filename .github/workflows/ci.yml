# LENSIQ CI — lint + typecheck + unit (Node), server tests (Python), end-to-end (headless Chrome, no WebGL),
# privacy (no third-party requests), i18n coverage, Git LFS readiness.
# The site itself is static (GitHub Pages); this workflow only tests it. pages-lfs.yml deploys ONLY after this workflow
# succeeds for a push to main (workflow_run gate). Actions are pinned to commit SHAs (Dependabot: .github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint + unit (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Git LFS (docs/LFS-MIGRATION.md): cached by object list; no-ops while vendor/ is still plain git
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - name: no LFS pointer files in the working tree
        run: node tools/check-lfs.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Format check on ADDED lines only (tools/format-check.mjs, rules in .editorconfig: LF, no tabs, no trailing
      # whitespace, code lines <= 200 characters). Fails a pull request; on a push to main it is reported as a warning
      # (round 12 introduced it — the round's own direct pushes are not blocked). Needs the parent commit: fetch-depth 2.
      - name: format check (added lines; fails on pull requests)
        run: |
          node tools/format-check.mjs --selftest
          if [ "${{ github.event_name }}" = "pull_request" ]; then node tools/format-check.mjs --base HEAD~1
          else node tools/format-check.mjs --base HEAD~1 --warn-only; fi
      - name: type-check shared modules (tsc --checkJs, tsconfig.typecheck.json)
        run: npm run typecheck
      - name: unit tests (includes backend/ Worker — auth, analytics validation, retention, entitlements, Opn webhook, AI proxy — on an in-memory D1 shim)
        run: npm run test:unit
      # Owner decision 85 ก (2026-11-17): every repo file named in any evals-locks/*.sha256 must equal its LATEST locked
      # hash; a deleted locked file needs a "# retired <path> reason: <why>" line. Uses only evals-locks/ + repo files.
      - name: locked test files match their latest lock (tools/eval-guard.mjs repo)
        run: node tools/eval-guard.mjs repo
      # Ratchet: type errors across ALL root *.js (npm run typecheck:report) may only go down. When you fix files, lower
      # TYPECHECK_MAX to the new total in the same commit; never raise it. Lower it at the end of EVERY round:
      #   round 10: 800 (measured 790)   round 11: 714 (palm.js 46 -> 0 and gated; pricing/account/report/legal/leads gated)
      #   round 12: 632 (measured 624: photobooth.js 93 -> 0 and gated as its own program — page scripts are now counted
      #             in their own program, as the gate checks them; +8 for the round's parallel work in flight — lower it
      #             to the measured total at the start of round 13). 136 of the 624 are vendor/mediapipe/vision_bundle.mjs,
      #             pulled in by signage.js's literal import() (photobooth.js imports it through a variable path).
      #   round 17: 627 (measured 627; lensiq-pc.js / -run.js / -ui.js now gated in tsconfig.typecheck.json)
      #   batch-5: 607 (measured 607; Window types for the item-177 caution packs and the horoscope / astro / lifecal globals)
      - name: typecheck ratchet — total errors in the full report must not rise
        env:
          TYPECHECK_MAX: "607"
        run: |
          npm run --silent typecheck:report | tee typecheck-report.txt
          total=$(sed -nE 's/^([0-9]+) error\(s\) in .*/\1/p' typecheck-report.txt | tail -1)
          test -n "$total" || { echo "could not read the error total"; exit 1; }
          echo "typecheck report: $total error(s), ratchet max $TYPECHECK_MAX"
          if [ "$total" -gt "$TYPECHECK_MAX" ]; then echo "::error::type errors rose to $total (max $TYPECHECK_MAX)"; exit 1; fi
      # The API Worker really bundles (wrangler's esbuild, pinned by backend/package-lock.json). --dry-run needs no
      # Cloudflare account or secrets and deploys nothing. Runs after typecheck: backend/node_modules would otherwise
      # replace the minimal ambient SDK types of backend/types/worker.d.ts.
      - name: API Worker bundles (wrangler deploy --dry-run)
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-admin.mjs
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
          test -s "$RUNNER_TEMP/worker-dist/worker.js"
          # production environment (A1, prepared only): wrangler.production.toml [env.production]; no account, nothing deployed
          npx wrangler deploy --dry-run --config wrangler.production.toml --env production --outdir "$RUNNER_TEMP/worker-dist-prod"
          test -s "$RUNNER_TEMP/worker-dist-prod/worker.js"
      # Round 11: the Worker in the REAL runtime (workerd via Miniflare from backend/node_modules) with a real local D1,
      # the real migrations and a faked Opn / Google / Turnstile — checkout -> webhook -> receipt -> refund -> credit note.
      - name: API Worker integration (workerd + local D1)
        run: npm run test:integration
      - name: CSP <meta> present and current on every page
        run: node tools/csp-meta.mjs --check
      - name: no Google Fonts / third-party font references (fonts are self-hosted)
        run: node tools/self-host-fonts.mjs --check
      - name: published site contains no server code / tests / tools / docs / package.json / *.py (allowlist build)
        run: node tools/build-site.mjs && node tools/check-site.mjs --static
      # Production bundle (A3, prepared only; never deployed from CI): customer lock, old address rewritten, canonical, _headers,
      # 25 MiB per-file limit, no absolute /lensiq/ path. Built with a placeholder domain (.example is reserved) into its own folder.
      - name: production site bundle builds and passes the static checks (placeholder domain)
        run: node tools/build-prod-site.mjs --base https://www.lensiq.example/ --out _site-prod && node tools/check-site.mjs --static --dir _site-prod
      - name: legal pages have no raw [placeholders]; seller details complete whenever billing is on
        run: node tools/check-legal.mjs

  # Owner decision 111 (2026-11-19): personal data must not be committed again (commit 8e44c420 carried a Wrangler cache
  # file with the owner's device location). Blocking: the tracked tree, and the added lines of EVERY pushed commit, so
  # data added and removed again within one push still fails. Values are never printed. Allow-list: tools/pii-allow.json.
  pii:
    name: No personal data (tracked files + pushed commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: tracked files (node tools/pii-scan.mjs --tracked)
        run: node tools/pii-scan.mjs --tracked
      - name: added lines of the pushed commits (node tools/pii-scan.mjs --range)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin main
          head=$(git rev-parse HEAD)
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"
          elif [ "$EVENT" = "push" ]; then
            # a push: scan exactly the pushed commits. No usable "before" (new ref, or a force-push whose old tip is gone):
            # fail closed by scanning the FULL history of HEAD (old synthetic fixtures in deleted files then fail too;
            # the owner decides). Never an empty range.
            if [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"
            else base=""; fi
          else
            # workflow_dispatch: the branch's own commits; on main itself (merge-base = HEAD) the tip commit
            base=$(git merge-base FETCH_HEAD HEAD || true)
            if [ "$base" = "$head" ]; then base=$(git rev-parse HEAD~1 2>/dev/null || true); fi
          fi
          if [ -z "$base" ]; then
            echo "no usable base: scanning the full history of HEAD"
            node tools/pii-scan.mjs --range HEAD
          else
            echo "scanning $base..HEAD"
            node tools/pii-scan.mjs --range "$base..HEAD"
          fi

  python:
    name: Server tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/python -v

  # Round 16: the browser checks run as two parallel jobs (same checks, same flags) because one job passed 75 minutes
  # once the 7 category pages were added. Neither job skips or loosens anything.
  # Owner decision 2026-11-11 (gate time, option ค): the e2e files run in 3 parallel shards (tools/e2e-shards.mjs, balanced by
  # tests/e2e/shard-weights.json) and the phone / language gates in 2 parallel parts. Same checks, same flags, same single
  # retry per failing file. Owner decision 102 ก (2026-11-18): a 4th Linux shard (4 Linux + the macOS WebKit shard = 5) so
  # each job is about 48 min or less; nothing dropped, same 75-min timeout, no added retries.
  # The job "e2e shards: every test file ran exactly once" turns CI red when any shard is missing,
  # any file ran twice or not at all, or a shard ran a file it was not given.
  e2e:
    name: End-to-end (headless Chrome) ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Git LFS (docs/LFS-MIGRATION.md): cached by object list; no-ops while vendor/ is still plain git
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python venv for server.py (agg / csp e2e start the real server)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - run: npm ci
      # Thai + CJK fonts from a cache keyed by the exact package list (tools/ci-fonts.lock: name, version, SHA-256). Every
      # .deb is checked against its SHA-256 before dpkg -i; a cache file with a wrong hash fails the job. The log says
      # whether the fonts came from the cache or the network. Owner decision 2026-11-11 (runners failed to resolve the
      # Ubuntu mirrors three times). No retries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-fonts
          key: ci-fonts-${{ hashFiles('tools/ci-fonts.lock') }}
      - name: Thai + CJK fonts (line-breaking checks need real glyphs)
        run: node tools/ci-fonts.mjs install ~/.cache/ci-fonts
      # The WebKit files (*webkit*.e2e.mjs) are not in these four shards: they form shard 5/5 on macOS (job e2e-webkit-mac
      # below), so the Linux shards need no WebKit install.
      - name: e2e shard ${{ matrix.shard }}/4 of the Linux files (one retry per failing file)
        run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/5 --mac-last --manifest=e2e-shard-${{ matrix.shard }}.json
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: e2e-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
      # the three site-wide checks, one per shard 1-3 (each runs exactly once per CI run; shard 4 has none)
      - name: built _site — every page loads under /lensiq/ in TH + 中文 with no 404 (same as the Pages deploy)
        if: matrix.shard == 1
        run: node tools/build-site.mjs && node tools/check-site.mjs
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: no page requests a third-party origin (th + zh)
        if: matrix.shard == 2
        run: node tools/check-external.mjs --as-is
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: pages under the GitHub Pages <meta> CSP
        if: matrix.shard == 3
        run: node tools/check-csp.mjs
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}

  # Shard 5/5: every WebKit (iOS engine) e2e file, on macOS. Linux WebKit plays no camera video at all (stream B, 4
  # diagnostic runs, docs/PHONE-QUALITY.md §4), so the camera flows of tests/e2e/phone-webkit-*.e2e.mjs can only run on
  # macOS WebKit, which is also the closer engine to iOS Safari. The quote-form WebKit files run here too, so all WebKit
  # files share one engine. Same runner, same --retry=1 rule, no skips. Coordinator decision 2026-11-14 (option 1, public
  # repo: macOS runners cost nothing). Its manifest is checked by e2e-shards like the other four.
  e2e-webkit-mac:
    name: End-to-end (WebKit, iPhone width, macOS) 5/5
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: npm ci
      # the WebKit build pinned by the playwright devDependency (package-lock.json), cached by that lock file
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-webkit-mac-${{ hashFiles('package-lock.json') }}
      - name: WebKit for the iPhone-width e2e files
        run: npx playwright install webkit
      - name: e2e shard 5/5, the WebKit files (one retry per failing file)
        run: npm run test:e2e:ci -- --shard=5/5 --mac-last --manifest=e2e-shard-5.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-shard-5
          path: e2e-shard-5.json
          if-no-files-found: ignore

  e2e-shards:
    name: "e2e shards: every test file ran exactly once"
    needs: [e2e, e2e-webkit-mac]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-shard-*
          path: e2e-shards
      - name: every *.e2e.mjs ran in exactly one shard; all 5 shards reported
        run: |
          mkdir -p e2e-shards
          node tools/e2e-shards.mjs --check e2e-shards

  browser-audits:
    name: Phone and language gates (headless Chrome) — ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [phone, language]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Git LFS (docs/LFS-MIGRATION.md): cached by object list; no-ops while vendor/ is still plain git
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Python venv for server.py (agg / csp e2e start the real server)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - run: npm ci
      # Thai + CJK fonts from a cache keyed by the exact package list (tools/ci-fonts.lock: name, version, SHA-256). Every
      # .deb is checked against its SHA-256 before dpkg -i; a cache file with a wrong hash fails the job. The log says
      # whether the fonts came from the cache or the network. Owner decision 2026-11-11 (runners failed to resolve the
      # Ubuntu mirrors three times). No retries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ci-fonts
          key: ci-fonts-${{ hashFiles('tools/ci-fonts.lock') }}
      - name: Thai + CJK fonts (line-breaking checks need real glyphs)
        run: node tools/ci-fonts.mjs install ~/.cache/ci-fonts
      - name: mobile-audit detector self-test
        if: matrix.part == 'phone'
        run: node tools/mobile-audit.mjs --selftest
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: phone gate — no horizontal overflow, text contrast >= 4.5:1, every form control labelled (320 / 360 / 390 px)
        if: matrix.part == 'phone'
        run: |
          for w in 320 360 390; do
            node tools/mobile-audit.mjs --width $w --strict --checks overflow,contrast,unlabeled,errors --details || exit 1
          done
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # English and Chinese strings are longer / wider than Thai: the same page can overflow at 360 px only in EN
      # (driver.html, round 10). Touch targets (>= 44 x 44 CSS px, WCAG 2.5.5) are gated here too.
      - name: phone gate — 360 px in TH / EN / 中文 and 390 px TH (overflow, touch targets >= 44 px, contrast)
        if: matrix.part == 'phone'
        run: |
          for lang in th en zh; do
            node tools/mobile-audit.mjs --width 360 --lang $lang --strict --checks overflow,targets,contrast,hiddenShown,crumbs,thaiTracking --details || exit 1
          done
          node tools/mobile-audit.mjs --width 390 --lang th --strict --checks overflow,targets,contrast --details
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      # Round 12: the same checks AFTER interaction — open drawer, compact language menu (320 px), sign-in dialog, guest
      # (light) and full readings, the signed-in account page and its error state (mocked API Worker from
      # tests/e2e/member.e2e.mjs; nothing leaves the runner). Also: no element with [hidden] may render, the breadcrumb
      # stays on one line, Thai is never letter-spaced, and each state's own expectations (no "retry" when nothing failed).
      - name: phone gate — post-interaction states at 360 px in TH / EN / 中文
        if: matrix.part == 'language'
        run: |
          for lang in th en zh; do
            node tools/mobile-audit.mjs --states --width 360 --lang $lang --strict --checks overflow,targets,contrast,hiddenShown,crumbs,thaiTracking,state,errors --details || exit 1
          done
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: shared components 100 % Chinese in 中文 mode
        if: matrix.part == 'language'
        run: node tools/zh-coverage.mjs --shared --no-interact --max 0
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: shared components 100 % English in English mode
        if: matrix.part == 'language'
        run: node tools/zh-coverage.mjs --lang en --shared --no-interact --max 0
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: zh coverage report per page (after typical interactions)
        if: always() && matrix.part == 'language'
        run: node tools/zh-coverage.mjs --top 10 --json zh-coverage.json
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: Latin-only leftovers on Thai and 中文 pages (report only — untranslated English / technical wording)
        if: always() && matrix.part == 'language'
        run: |
          node tools/zh-coverage.mjs --latin --lang th --no-interact --json latin-th.json
          node tools/zh-coverage.mjs --latin --lang zh --no-interact --json latin-zh.json
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: phone layout report (390 px)
        if: always() && matrix.part == 'language'
        run: node tools/mobile-audit.mjs --json mobile-audit.json
        env:
          LQ_CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.part == 'language'
        with:
          name: mobile-audit
          path: mobile-audit.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.part == 'language'
        with:
          name: zh-coverage
          path: |
            zh-coverage.json
            latin-th.json
            latin-zh.json
          if-no-files-found: ignore
