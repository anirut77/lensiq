# Deploy GitHub Pages WITH Git LFS content. "Deploy from branch" Pages serves LFS *pointer* files, so once vendor/
# binaries move to LFS (docs/LFS-MIGRATION.md) the site must be deployed by this workflow instead.
# Activation (step 6 of the migration): Settings → Pages → Source = "GitHub Actions", then uncomment the `push` trigger.
name: Pages (with LFS)

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: LFS object list (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull
      - name: refuse to publish pointer files
        run: node tools/check-lfs.mjs
      - name: assemble site (pages + vendor only; no server code, tests or tools)
        run: |
          mkdir -p _site
          cp -R *.html *.css *.js i18n vendor _site/
          rm -f _site/eslint.config.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
