# Dependabot — weekly update PRs. GitHub Actions are pinned to commit SHAs (with the tag in a trailing comment);
# Dependabot bumps both together. npm/pip versions are exact pins, so every bump is a reviewed PR that CI must pass
# before pages-lfs.yml can deploy it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["eslint", "@eslint/*", "globals", "typescript"]
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
