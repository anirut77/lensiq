# backend/wrangler.toml — LENSIQ API Worker (Cloudflare Workers + D1). See docs/BACKEND.md for the deploy steps.
# Secrets are NEVER written here. Set them with `wrangler secret put <NAME>` (list in docs/BACKEND.md):
#   ADMIN_BOOTSTRAP_TOKEN  one-time owner bootstrap token (>= 32 chars; delete after the owner account exists)
#   SECRETS_KEK            base64 of 32 random bytes — AES-GCM key-encryption key (TOTP secret, admin-set API key)
#   ANTHROPIC_API_KEY      preferred way to give the fortune writing assistant its key
#   OPN_SECRET_KEY / OPN_PUBLIC_KEY / OPN_WEBHOOK_SECRET   Opn (Omise) TEST keys until go-live
#   TURNSTILE_SECRET       Cloudflare Turnstile secret for /api/fortune + checkout + sign-in + leads (REQUIRED: all
#                          refuse without it; site key goes in lensiq-config.js window.LENSIQ_TURNSTILE_SITEKEY)
#   ALERT_WEBHOOK_URL      optional https incoming-webhook URL (Slack / Discord / ntfy …) for owner alerts — no PII sent
#   LINE_CHANNEL_ACCESS_TOKEN  optional (2026-11-12) LINE Messaging API channel access token of the LINE OA "LENSIQ"
#   LEAD_NOTIFY_LINE_TO    optional: the owner's LINE user ID (U + 32 hex). With both set, each new quote request pushes
#                          "LENSIQ: คำขอใบเสนอราคาใหม่ #id time" to the owner (no personal data). The owner enters both.
#   HEALTH_TOKEN           optional bearer token that protects GET /health/deep
#   MAIL_API_KEY           optional (round 12) — Resend / MailChannels API key for transactional e-mail (src/mail.js)
# The top-level configuration below is the on-premise / template default (placeholder D1 id: it cannot be deployed as is).
# The owner's Cloudflare account is SHARED with other projects: deploy ONLY through `npm run backend:deploy:test`
# (tools/backend-deploy.mjs: prints the target, passes --env test, refuses any name that is not lensiq-*). See [env.test]
# at the end of this file and docs/DEPLOY.md.
name = "lensiq-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Origins (scheme://host[:port]) allowed to call the public API (fortune, analytics, billing). Comma separated.
ALLOWED_ORIGINS = "https://example.github.io"
# Extra origins allowed to use the admin API. The Worker's own origin (admin served by this Worker, recommended:
# https://admin.<domain>) is always allowed; there is NO fallback to ALLOWED_ORIGINS.
ADMIN_ORIGINS = ""
# REQUIRED with TURNSTILE_SECRET (fail closed): hostnames Turnstile tokens must have been issued on, e.g. "www.example.co.th"
TURNSTILE_HOSTNAMES = ""
# Global hourly cap on public checkouts (on top of 5 per caller per hour)
CHECKOUT_GLOBAL_HOUR = "30"
# Extra analytics feature slugs accepted besides backend/src/constants.js ANALYTICS_FEATURES (comma separated)
ANALYTICS_FEATURES = ""
# "Sign in with Google" OAuth 2.0 Client ID (Web application) from Google Cloud Console — PUBLIC, not a secret.
# Empty = member sign-in off (no gating anywhere). Same value as window.LENSIQ_GOOGLE_CLIENT_ID in lensiq-config.js.
GOOGLE_CLIENT_ID = ""
# Global cap on Google sign-ins per 15 min (on top of 10 per caller)
SIGNIN_GLOBAL_15MIN = "300"
# Member usage ledger rows (readings / AI uses) are kept this many days; payment rows are kept with the payment
MEMBER_LEDGER_DAYS = "400"
# FREE service today: every feature unlocked, quotas counted but not enforced.
FREE_MODE = "true"
# Public PromptPay checkout. Keep "false" until pricing, terms and VAT registration are final.
# With billing on, checkout REQUIRES a signed-in member (the purchase raises that account's quota).
BILLING_ENABLED = "false"
# Legacy opt-in: let guests buy without signing in (they get customer_id + order_token once and link the purchase
# later with POST /v1/billing/claim). Ignored while the owner requires membership. Keep "false".
ALLOW_GUEST_CHECKOUT = "false"
# Refuse non-test Opn keys unless this is "true" (go-live switch).
OPN_ALLOW_LIVE = "false"
# Thai VAT: only a VAT-registered seller (turnover > 1.8 M THB/yr or voluntary) may charge VAT / issue a tax invoice.
VAT_REGISTERED = "false"
SELLER_NAME = ""
SELLER_TAX_ID = ""
SELLER_ADDRESS = ""
SELLER_BRANCH = "สำนักงานใหญ่"
# Go-live gate (src/golive.js). "enforce": checkout and NEW Google sign-ins are refused (503 go_live_blocked) while
# SELLER_NAME / SELLER_TAX_ID / SELLER_ADDRESS are empty, a LEGAL_*_READY flag is not "true", ALLOWED_ORIGINS contains
# localhost with the Turnstile dev bypass on, or (billing / live keys on) the owner has no TOTP. "report" = only shown
# in admin (staging / test-mode runs). Live Opn money is ALWAYS refused while any of these is open.
GO_LIVE_GATE = "enforce"
# Set to "true" only after counsel signed off terms.html / privacy.html (no [placeholders], no "ฉบับร่าง" banner).
LEGAL_TERMS_READY = "false"
LEGAL_PRIVACY_READY = "false"
# Owner TOTP is required for money ops while billing / live keys are on; "true" requires it always.
# Round 12: "true" in this (production) file — complimentary grants / refunds / test charges need owner TOTP from day
# one. Unit tests and `wrangler dev` without this var keep the old behaviour (TOTP only while billing / live keys are on).
REQUIRE_OWNER_TOTP = "true"
# How money ops re-authenticate (src/auth.js moneyReauthMode): "window" = body {password, totp} OR the 5-min sudo window
# (POST /admin/api/reauth); "inline" = {password, totp} in that very request. Empty = "window" with test keys and
# "inline" automatically once OPN_ALLOW_LIVE=true.
MONEY_REAUTH = ""
# Admin test charges per hour (POST /admin/api/billing/test-charge; re-auth required, every attempt audited)
TEST_CHARGE_HOUR = "10"
# Pending payments re-checked with Opn per 15-min cron run (unfulfilled successful payments repaired: same batch size)
RECONCILE_BATCH = "25"
# B2B demo requests (POST /v1/leads): kept this many days; global cap per Bangkok day
LEADS_DAYS = "180"
LEADS_GLOBAL_DAY = "200"
# Transactional e-mail (src/mail.js): receipt / credit-note notices and a renewal reminder 3 days before a paid period
# ends. OFF while MAIL_PROVIDER is empty (every mail logged as skipped_not_configured). Needs a provider account and the
# sender domain's SPF / DKIM / DMARC; the API key is the SECRET MAIL_API_KEY (`wrangler secret put MAIL_API_KEY`).
MAIL_PROVIDER = ""
MAIL_FROM = ""
# Public site origin for links in e-mails (https://…, no trailing slash)
SITE_URL = ""
# CSP violation report counters (POST /v1/csp-report): kept this many days; global cap per Bangkok day
CSP_REPORT_DAYS = "90"
CSP_REPORT_GLOBAL_DAY = "5000"
# Product Check official lookups (round 17 P4, src/pc.js; GET /api/pc/*, POST /api/pc/batch). "false" -> 404 on /api/pc/*.
PC_ENABLED = "true"
# Thai FDA web service (WS_LICENSE_SEARCH): "live" = call it (DEMO / TESTING: owner decision 2026-11-09); "link" = never call
# it, the card links to oryor.com. The service states no reuse licence: written permission from Thai FDA is needed BEFORE
# CHARGING (CTO-BRIEF L13). The owner can override this through the admin API GET|PUT /admin/api/pc/lookup (re-auth,
# audited; no admin.html control yet); the stored setting wins over this var.
PC_THFDA_MODE = "live"
# "demo" (this file) or "customer". In a customer build the testing-only sources (Thai FDA, EU Safety Gate, RASFF: licence or
# endpoint not confirmed, L13 / L16) are OFF unless the owner switches them on through the admin API; answers keep the licence label.
PC_BUILD = "demo"
# Product Check: one tap = one POST /api/pc/batch = ONE count; per caller per minute (1-120). Without D1 an in-memory
# limiter applies per isolate.
PC_RATE_MIN = "30"
# Health Canada recalls are NOT fetched by the Worker: tools/pc-hc-build.mjs shards the open-data file offline into
# vendor/pc-recalls/hc/ and the page searches those static files (free plan and *.workers.dev work; nothing is sent).
# Retention (days). Raw analytics events are purged after RAW_EVENT_DAYS; daily aggregates are kept.
RAW_EVENT_DAYS = "90"
AUDIT_DAYS = "400"
WEBHOOK_PAYLOAD_DAYS = "90"

[[d1_databases]]
binding = "DB"
database_name = "lensiq"
# Replace with the id printed by `wrangler d1 create lensiq` (not a secret).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
# 03:17 UTC daily: aggregate analytics, purge expired raw data, rotate salts.
# every 15 min: reconcile pending PromptPay payments with Opn (lost / failed webhooks).
crons = ["17 3 * * *", "*/15 * * * *"]

# Admin back office served from the Worker's own origin (built by `npm run build:admin` into ./admin-dist).
# The Worker runs first and adds frame-ancestors 'none' / X-Frame-Options DENY / strict CSP as HTTP headers.
[assets]
directory = "./admin-dist"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
# Logs never contain facts, events, keys, passwords or IPs (see src/util.js log()).
head_sampling_rate = 1

# ======================================================================================================================
# TEST environment (closed tester group, owner decisions 2026-11-10; docs/DEPLOY.md). Deployed ONLY with
#   npm run backend:deploy:test        (tools/backend-deploy.mjs: prints the targets, --env test, name guard)
# New, clearly named resources only: Worker "lensiq-api-test", D1 "lensiq-test". Nothing else in the account is touched.
# vars and D1 bindings are not inherited by an environment, so every var is repeated here (a unit test checks that none
# is missing). Secrets are set with `npm run secrets:setup` (never written here).
[env.test]
name = "lensiq-api-test"
workers_dev = true
# no extra public preview / version hostnames
preview_urls = false

# Workers Logs: the Free plan gives the whole ACCOUNT 200,000 log events / day, shared with the owner's other Workers.
# Half of the invocations are logged (with the request cap below: at most about 10 % of that quota).
[env.test.observability]
enabled = true
head_sampling_rate = 0.5

# only the daily maintenance cron: the 15-minute payment reconcile has nothing to do (billing is off) and the Free plan
# allows 5 cron triggers per ACCOUNT, shared with the owner's other Workers
[env.test.triggers]
crons = ["17 3 * * *"]

[env.test.vars]
ALLOWED_ORIGINS = "https://anirut77.github.io"
ADMIN_ORIGINS = ""
TURNSTILE_HOSTNAMES = "anirut77.github.io"
CHECKOUT_GLOBAL_HOUR = "30"
ANALYTICS_FEATURES = ""
GOOGLE_CLIENT_ID = ""
SIGNIN_GLOBAL_15MIN = "300"
MEMBER_LEDGER_DAYS = "400"
FREE_MODE = "true"
BILLING_ENABLED = "false"
ALLOW_GUEST_CHECKOUT = "false"
OPN_ALLOW_LIVE = "false"
VAT_REGISTERED = "false"
SELLER_NAME = ""
SELLER_TAX_ID = ""
SELLER_ADDRESS = ""
SELLER_BRANCH = "สำนักงานใหญ่"
GO_LIVE_GATE = "enforce"
LEGAL_TERMS_READY = "false"
LEGAL_PRIVACY_READY = "false"
REQUIRE_OWNER_TOTP = "true"
MONEY_REAUTH = ""
TEST_CHARGE_HOUR = "10"
RECONCILE_BATCH = "25"
LEADS_DAYS = "180"
# quote requests (owner decision 2026-11-12, form ON): at most 50 a Bangkok day for everyone (spam ceiling; 5 per caller
# per hour is fixed in src/leads.js); LINE pushes to the owner at most LEAD_NOTIFY_LINE_DAY a day. The LINE token and the
# recipient are Worker SECRETS the owner enters (npm run secrets:setup -- --only LINE_CHANNEL_ACCESS_TOKEN /
# --only LEAD_NOTIFY_LINE_TO); both unset = no LINE push.
LEADS_GLOBAL_DAY = "50"
LEAD_NOTIFY_LINE_DAY = "50"
MAIL_PROVIDER = ""
MAIL_FROM = ""
SITE_URL = "https://anirut77.github.io/lensiq"
CSP_REPORT_DAYS = "90"
CSP_REPORT_GLOBAL_DAY = "5000"
PC_ENABLED = "true"
PC_THFDA_MODE = "live"
PC_BUILD = "demo"
PC_RATE_MIN = "30"
RAW_EVENT_DAYS = "90"
AUDIT_DAYS = "400"
WEBHOOK_PAYLOAD_DAYS = "90"
# ---- test-environment switches (not in the default configuration) ----
# Tester access code gate (src/tester.js): AI features, fortune AI and the testing-only lookup sources (Thai FDA web
# service, EU Safety Gate, RASFF: owner decision D2) answer only requests that carry the code in X-Tester-Code.
# "required" + secret TESTER_ACCESS_CODE missing or shorter than 16 characters = everyone is refused (fail closed).
TESTER_GATE = "required"
# The consent screen names the real serving provider: router models are pinned to it (src/ai/adapters, deploy B6).
AI_ROUTE_PIN = "required"
# LENSIQ-side cap on public requests per UTC day. The Free plan gives the whole ACCOUNT 100,000 requests / day, shared
# with the owner's other Workers: LENSIQ stops itself at 20 % of it and answers 429 "try again tomorrow" (fail closed).
DAILY_REQUEST_CAP = "20000"
# Public routes of THIS deployment (src/tester.js). Anything else answers 404 "not enabled in this deployment" before D1
# is touched: analytics (/v1/events), billing, member sign-in, fortune AI (no key, not part of this test) and CSP reports
# are OFF here. /v1/config then reports analytics, sign-in and billing as off.
# 2026-11-12 (owner decision, explicit): the quote form is ON: /v1/leads (Turnstile fail closed, 5 per caller per hour,
# LEADS_GLOBAL_DAY a day, 180-day deletion) and the owner's LINE test /health/notify-test (Bearer HEALTH_TOKEN) are open.
PUBLIC_ROUTES = "/health,/health/deep,/health/notify-test,/v1/config,/v1/tester/check,/v1/leads,/v1/ai/*,/api/pc/*,/api/med/*"
# Budget of D1 write statements per UTC day caused by public routes (approximate: counted per isolate, stored every 10
# requests). The Free plan gives the whole ACCOUNT 100,000 rows written a day, shared with the owner's other projects:
# LENSIQ stops itself at about 5 % and answers 429 "try again tomorrow"; the owner gets an alert when that happens.
D1_WRITE_BUDGET = "5000"
# Unauthenticated admin requests (failed sign-ins) may cause at most this many D1 write statements per hour and isolate.
# Over it, sign-ins are still checked and a correct one still succeeds, but failed ones write nothing (src/tester.js).
ADMIN_UNAUTH_WRITES_HOUR = "120"

[[env.test.d1_databases]]
binding = "DB"
database_name = "lensiq-test"
# Written by `npm run backend:d1:create` / `backend:d1:bind` (tools/backend-deploy.mjs) from the id wrangler prints. Not a secret.
# Do not edit by hand: a unit test accepts only the placeholder or the id recorded in deploy/created.json.
database_id = "3385c7cc-d171-42ae-9d4c-8fdd8c12b21f"
migrations_dir = "migrations"
