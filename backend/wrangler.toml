# backend/wrangler.toml — LENSIQ API Worker (Cloudflare Workers + D1). See docs/BACKEND.md for the deploy steps.
# Secrets are NEVER written here. Set them with `wrangler secret put <NAME>` (list in docs/BACKEND.md):
#   ADMIN_BOOTSTRAP_TOKEN  one-time owner bootstrap token (>= 32 chars; delete after the owner account exists)
#   SECRETS_KEK            base64 of 32 random bytes — AES-GCM key-encryption key (TOTP secret, admin-set API key)
#   ANTHROPIC_API_KEY      preferred way to give the fortune writing assistant its key
#   OPN_SECRET_KEY / OPN_PUBLIC_KEY / OPN_WEBHOOK_SECRET   Opn (Omise) TEST keys until go-live
#   TURNSTILE_SECRET       Cloudflare Turnstile secret for /api/fortune + checkout + sign-in + leads (REQUIRED: all
#                          refuse without it; site key goes in lensiq-config.js window.LENSIQ_TURNSTILE_SITEKEY)
#   ALERT_WEBHOOK_URL      optional https incoming-webhook URL (Slack / Discord / ntfy …) for owner alerts — no PII sent
#   HEALTH_TOKEN           optional bearer token that protects GET /health/deep
name = "lensiq-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# Origins (scheme://host[:port]) allowed to call the public API (fortune, analytics, billing). Comma separated.
ALLOWED_ORIGINS = "https://example.github.io"
# Extra origins allowed to use the admin API. The Worker's own origin (admin served by this Worker, recommended:
# https://admin.<domain>) is always allowed; there is NO fallback to ALLOWED_ORIGINS.
ADMIN_ORIGINS = ""
# REQUIRED with TURNSTILE_SECRET (fail closed): hostnames Turnstile tokens must have been issued on, e.g. "www.example.co.th"
TURNSTILE_HOSTNAMES = ""
# Global hourly cap on public checkouts (on top of 5 per caller per hour)
CHECKOUT_GLOBAL_HOUR = "30"
# Extra analytics feature slugs accepted besides backend/src/constants.js ANALYTICS_FEATURES (comma separated)
ANALYTICS_FEATURES = ""
# "Sign in with Google" OAuth 2.0 Client ID (Web application) from Google Cloud Console — PUBLIC, not a secret.
# Empty = member sign-in off (no gating anywhere). Same value as window.LENSIQ_GOOGLE_CLIENT_ID in lensiq-config.js.
GOOGLE_CLIENT_ID = ""
# Global cap on Google sign-ins per 15 min (on top of 10 per caller)
SIGNIN_GLOBAL_15MIN = "300"
# Member usage ledger rows (readings / AI uses) are kept this many days; payment rows are kept with the payment
MEMBER_LEDGER_DAYS = "400"
# FREE service today: every feature unlocked, quotas counted but not enforced.
FREE_MODE = "true"
# Public PromptPay checkout. Keep "false" until pricing, terms and VAT registration are final.
# With billing on, checkout REQUIRES a signed-in member (the purchase raises that account's quota).
BILLING_ENABLED = "false"
# Legacy opt-in: let guests buy without signing in (they get customer_id + order_token once and link the purchase
# later with POST /v1/billing/claim). Ignored while the owner requires membership. Keep "false".
ALLOW_GUEST_CHECKOUT = "false"
# Refuse non-test Opn keys unless this is "true" (go-live switch).
OPN_ALLOW_LIVE = "false"
# Thai VAT: only a VAT-registered seller (turnover > 1.8 M THB/yr or voluntary) may charge VAT / issue a tax invoice.
VAT_REGISTERED = "false"
SELLER_NAME = ""
SELLER_TAX_ID = ""
SELLER_ADDRESS = ""
SELLER_BRANCH = "สำนักงานใหญ่"
# Go-live gate (src/golive.js). "enforce": checkout and NEW Google sign-ins are refused (503 go_live_blocked) while
# SELLER_NAME / SELLER_TAX_ID / SELLER_ADDRESS are empty, a LEGAL_*_READY flag is not "true", ALLOWED_ORIGINS contains
# localhost with the Turnstile dev bypass on, or (billing / live keys on) the owner has no TOTP. "report" = only shown
# in admin (staging / test-mode runs). Live Opn money is ALWAYS refused while any of these is open.
GO_LIVE_GATE = "enforce"
# Set to "true" only after counsel signed off terms.html / privacy.html (no [placeholders], no "ฉบับร่าง" banner).
LEGAL_TERMS_READY = "false"
LEGAL_PRIVACY_READY = "false"
# Owner TOTP is required for money ops while billing / live keys are on; "true" requires it always.
REQUIRE_OWNER_TOTP = "false"
# Pending payments re-checked with Opn per 15-min cron run (unfulfilled successful payments repaired: same batch size)
RECONCILE_BATCH = "25"
# B2B demo requests (POST /v1/leads): kept this many days; global cap per Bangkok day
LEADS_DAYS = "180"
LEADS_GLOBAL_DAY = "200"
# Retention (days). Raw analytics events are purged after RAW_EVENT_DAYS; daily aggregates are kept.
RAW_EVENT_DAYS = "90"
AUDIT_DAYS = "400"
WEBHOOK_PAYLOAD_DAYS = "90"

[[d1_databases]]
binding = "DB"
database_name = "lensiq"
# Replace with the id printed by `wrangler d1 create lensiq` (not a secret).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
# 03:17 UTC daily: aggregate analytics, purge expired raw data, rotate salts.
# every 15 min: reconcile pending PromptPay payments with Opn (lost / failed webhooks).
crons = ["17 3 * * *", "*/15 * * * *"]

# Admin back office served from the Worker's own origin (built by `npm run build:admin` into ./admin-dist).
# The Worker runs first and adds frame-ancestors 'none' / X-Frame-Options DENY / strict CSP as HTTP headers.
[assets]
directory = "./admin-dist"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
# Logs never contain facts, events, keys, passwords or IPs (see src/util.js log()).
head_sampling_rate = 1
